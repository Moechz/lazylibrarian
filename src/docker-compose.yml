# ===========================================================================
# LazyLibrarian for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : linuxserver/lazylibrarian:8b6ba443-ls392 (Docker Hub, used unmodified)
#                  -> https://gitlab.com/LazyLibrarian/LazyLibrarian
#
# Ports   : host 8008 -> container 5299. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/lazylibrariandocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image boots with the s6-overlay v3 init, whose service manager
#           needs root; with user "1000:1000" nothing starts and port 5299 stays closed.
#           src/entrypoint.sh performs the same first-run setup as the image's init
#           (folders + default config) and runs the same command the s6 service runs,
#           directly as the unprivileged container user.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  lazylibrariandocker:
    image: linuxserver/lazylibrarian:8b6ba443-ls392
    container_name: lazylibrariandocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8008:5299"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/lazylibrariandocker/config:/config
      - /Volume1/DockerAppData/lazylibrariandocker/downloads:/downloads
      - /Volume1/DockerAppData/lazylibrariandocker/books:/books
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:5299/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8008
    protocol: http
